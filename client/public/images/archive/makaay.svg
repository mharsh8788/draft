<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 580" width="100%" height="100%">
  <defs>
    <radialGradient id="makaayBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#162032" />
      <stop offset="70%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#06080d" />
    </radialGradient>
    <pattern id="makaayGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#222c3d" stroke-width="0.75" opacity="0.4" />
    </pattern>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc052d" />
      <stop offset="100%" stop-color="#ff3b60" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="460" height="580" fill="url(#makaayBg)" />
  <rect width="460" height="580" fill="url(#makaayGrid)" />

  <!-- UEFA Champions League Pitch Radar Lines -->
  <circle cx="230" cy="220" r="150" fill="none" stroke="#27354d" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="230" cy="220" r="185" fill="none" stroke="#dc052d" stroke-width="1" opacity="0.3" />
  
  <!-- Pitch center circle & kickoff trajectory -->
  <ellipse cx="230" cy="220" rx="90" ry="40" fill="none" stroke="#374560" stroke-width="1.5" />
  <path d="M 170 235 Q 210 180 285 160" fill="none" stroke="#dc052d" stroke-width="2.5" stroke-dasharray="4 3" />
  <circle cx="285" cy="160" r="4" fill="#dc052d" />

  <!-- Top UEFA Tag -->
  <rect x="30" y="28" width="95" height="18" rx="3" fill="#dc052d" fill-opacity="0.15" stroke="#dc052d" stroke-opacity="0.4" />
  <text x="77.5" y="40" font-family="'Chakra Petch', monospace" font-size="9" font-weight="700" fill="#dc052d" text-anchor="middle" letter-spacing="1.5">UCL RECORD</text>
  <text x="430" y="40" font-family="'Chakra Petch', monospace" font-size="9" font-weight="600" fill="#64748b" text-anchor="end" letter-spacing="1">7 MARCH 2007</text>

  <!-- Central Stopwatch Display Motif -->
  <g transform="translate(230, 215)">
    <!-- Outer Chronometer Frame -->
    <rect x="-140" y="-55" width="280" height="110" rx="14" fill="#0d1420" stroke="#374560" stroke-width="2" />
    <rect x="-132" y="-47" width="264" height="94" rx="8" fill="#070b12" stroke="#1f2c42" stroke-width="1" />

    <!-- Record Timestamp in High-Contrast Monospace -->
    <text x="0" y="16" font-family="'Chakra Petch', monospace" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      10.12<tspan font-size="28" fill="#dc052d">s</tspan>
    </text>

    <!-- Sub-label -->
    <text x="0" y="38" font-family="'Chakra Petch', monospace" font-size="10" font-weight="700" fill="#dc052d" text-anchor="middle" letter-spacing="3">
      FASTEST UCL GOAL EVER
    </text>
  </g>

  <!-- Bottom Archival Caption -->
  <g transform="translate(30, 480)">
    <text x="0" y="16" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" fill="#dc052d" letter-spacing="2">UEFA CHAMPIONS LEAGUE</text>
    <text x="0" y="38" font-family="'Chakra Petch', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">ROY MAKAAY VS REAL MADRID</text>
    <text x="0" y="58" font-family="sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Round of 16 · Allianz Arena · Unbroken for 17+ years</text>
  </g>
</svg>
