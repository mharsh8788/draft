<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 580" width="100%" height="100%">
  <defs>
    <radialGradient id="origBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#162338" />
      <stop offset="65%" stop-color="#0b121e" />
      <stop offset="100%" stop-color="#060910" />
    </radialGradient>
    <pattern id="bavarianDiamond" width="40" height="24" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 12 L 20 24 L 0 12 Z" fill="#1e3a5f" fill-opacity="0.2" stroke="#254673" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
    <linearGradient id="blueWhiteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a75d3" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#18529e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="460" height="580" fill="url(#origBg)" />
  <rect width="460" height="580" fill="url(#bavarianDiamond)" />

  <!-- Bavarian White & Blue Archival Shield Motif -->
  <g transform="translate(230, 220)">
    <!-- Outer Shield Frame -->
    <path d="M 0 -130 C 90 -130 130 -90 130 10 C 130 90 60 145 0 170 C -60 145 -130 90 -130 10 C -130 -90 -90 -130 0 -130 Z" 
          fill="#0c1524" stroke="#2a75d3" stroke-width="2.5" />

    <!-- Inner Split: White (Left) & Blue (Right) -->
    <clipPath id="shieldClip">
      <path d="M 0 -126 C 86 -126 124 -88 124 10 C 124 86 57 139 0 163 C -57 139 -124 86 -124 10 C -124 -88 -86 -126 0 -126 Z" />
    </clipPath>

    <g clip-path="url(#shieldClip)">
      <!-- Left Half: Classic Off-White -->
      <rect x="-130" y="-130" width="130" height="310" fill="#f1f5f9" />
      <!-- Right Half: Historic Bavarian Royal Blue -->
      <rect x="0" y="-130" width="130" height="310" fill="#1d4ed8" />

      <!-- Bavarian Diamond Sash Across Shield -->
      <path d="M -130 -30 L 130 50 L 130 85 L -130 5 Z" fill="#0284c7" fill-opacity="0.35" />

      <!-- Vintage FCB Monogram (1902 Era) -->
      <text x="-65" y="22" font-family="'Chakra Petch', serif" font-size="42" font-weight="900" fill="#1e3a8a" text-anchor="middle">F</text>
      <text x="65" y="22" font-family="'Chakra Petch', serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
    </g>

    <!-- Year Badge -->
    <circle cx="0" cy="-130" r="28" fill="#0b121e" stroke="#2a75d3" stroke-width="2" />
    <text x="0" y="-124" font-family="'Chakra Petch', monospace" font-size="14" font-weight="900" fill="#60a5fa" text-anchor="middle">1902</text>
  </g>

  <!-- Top Archival Kicker Badge -->
  <rect x="30" y="28" width="115" height="18" rx="3" fill="#2563eb" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4" />
  <text x="87.5" y="40" font-family="'Chakra Petch', monospace" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="1.5">HISTORIC COLOURS</text>
  <text x="430" y="40" font-family="'Chakra Petch', monospace" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1">1902 NEWSLETTER</text>

  <!-- Bottom Archival Caption -->
  <g transform="translate(30, 480)">
    <text x="0" y="16" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="2">FOUNDING HERITAGE</text>
    <text x="0" y="38" font-family="'Chakra Petch', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">ORIGINAL WHITE &amp; BLUE</text>
    <text x="0" y="58" font-family="sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Bavarian state colours · Documented in 1902 club archives</text>
  </g>
</svg>
