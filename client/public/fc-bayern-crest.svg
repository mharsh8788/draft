<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Circular text paths -->
    <!-- Top arc for FC BAYERN -->
    <path id="top-arc" d="M 32,100 A 68,68 0 0,1 168,100" fill="none" />
    <!-- Bottom arc for MÜNCHEN -->
    <path id="bottom-arc" d="M 166,100 A 66,66 0 0,1 34,100" fill="none" />
    
    <!-- Clip path for inner Bavarian rhombus pattern -->
    <clipPath id="inner-circle-clip">
      <circle cx="100" cy="100" r="48" />
    </clipPath>
  </defs>

  <!-- Outer white border ring -->
  <circle cx="100" cy="100" r="98" fill="#FFFFFF" stroke="#0066B2" stroke-width="2" />

  <!-- Outer Bayern Red Ring -->
  <circle cx="100" cy="100" r="92" fill="#DC052D" />

  <!-- Inner Blue Ring Border -->
  <circle cx="100" cy="100" r="51" fill="#FFFFFF" stroke="#0066B2" stroke-width="2" />

  <!-- Inner Blue Circle Base -->
  <circle cx="100" cy="100" r="48" fill="#0066B2" />

  <!-- Bavarian Lozenge (Diamonds) Pattern in Inner Circle -->
  <g clip-path="url(#inner-circle-clip)">
    <!-- White angled stripe grid to create Bavarian diamonds -->
    <g transform="rotate(-30 100 100)">
      <rect x="40" y="40" width="120" height="120" fill="#0066B2" />
      <!-- Alternating Bavarian lozenges -->
      <path d="M 40,40 L 60,60 L 40,80 L 20,60 Z
               M 80,40 L 100,60 L 80,80 L 60,60 Z
               M 120,40 L 140,60 L 120,80 L 100,60 Z
               M 160,40 L 180,60 L 160,80 L 140,60 Z
               M 60,80 L 80,100 L 60,120 L 40,100 Z
               M 100,80 L 120,100 L 100,120 L 80,100 Z
               M 140,80 L 160,100 L 140,120 L 120,100 Z
               M 80,120 L 100,140 L 80,160 L 60,140 Z
               M 120,120 L 140,140 L 120,160 L 100,140 Z
               M 100,160 L 120,180 L 100,200 L 80,180 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Lettering in Red Ring -->
  <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="19" letter-spacing="3.5">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      FC BAYERN
    </textPath>
  </text>

  <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="4">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      MÜNCHEN
    </textPath>
  </text>
</svg>
